# True color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Reduce escape-time — eliminates mode-switching lag in Neovim
set -sg escape-time 1

# Neovim autoread and focus events
set -g focus-events on

# General
set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Vi copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Splits — open in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Ctrl+hjkl: pass through to Neovim when inside it, otherwise move tmux pane
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Status bar ─────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-style                 'bg=#1e1e1e fg=#c0c0c0'
set -g status-left-length           30
set -g status-left                  '#[fg=#87afff,bold] #S #[fg=#444444]│ '
set -g status-right                 '#[fg=#444444]│ #[fg=#87afff]%H:%M '
set -g status-right-length          15
set -g window-status-format         '#[fg=#666666] #I:#W '
set -g window-status-current-format '#[fg=#ffffff,bold] #I:#W '
set -g window-status-separator      ''

# Subtle pane borders
set -g pane-border-style            'fg=#2a2a2a'
set -g pane-active-border-style     'fg=#444444'

# Message style
set -g message-style                'bg=#1e1e1e fg=#87afff'
